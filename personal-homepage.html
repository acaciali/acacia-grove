<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23f8bbd0'/><circle cx='8' cy='8' r='4' fill='%23e91e63' opacity='.4'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: #fce4ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #7b5b7e;
      transition: background-color 0.8s ease;
    }

    body.evening { background-color: #f3e0e8; }
    body.night { background-color: #e8d5e0; }

    .container {
      text-align: left;
      padding: 2rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Greeting */
    .greeting {
      margin-bottom: 1.5rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .greeting-text {
      font-family: 'Quicksand', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #7b5b7e;
    }

    .greeting-sub {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: #c48bb0;
      margin-top: 0.15rem;
    }

    /* Main layout: calendar left, links right */
    .top-row {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 1rem;
      align-items: start;
    }

    .widget {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(244, 180, 210, 0.25);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(220, 160, 190, 0.2);
      overflow: hidden;
      text-align: left;
    }

    .widget-header {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #c48bb0;
      padding: 0.7rem 1rem 0.3rem;
    }

    .calendar-widget {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .calendar-widget .widget-body {
      flex: 1;
      padding: 0;
    }

    .calendar-widget iframe {
      width: 100%;
      height: 100%;
      min-height: 450px;
      border: none;
    }

    /* Weather (inline with greeting) */
    .weather {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'Quicksand', sans-serif;
      color: #7b5b7e;
      white-space: nowrap;
    }

    .weather svg { width: 22px; height: 22px; flex-shrink: 0; }
    .weather-temp { font-size: 1.1rem; font-weight: 700; }
    .weather-desc { font-size: 0.65rem; font-weight: 500; color: #c48bb0; }

    /* Categories layout */
    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem 2rem;
    }

    .category {
      margin-bottom: 0.6rem;
    }

    .category-label {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: #c48bb0;
      margin-bottom: 0.4rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 0.7rem;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: #7b5b7e;
      padding: 0.75rem 0.5rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(244, 180, 210, 0.25);
      box-shadow: 0 2px 8px rgba(220, 160, 190, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    .tile:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 4px 14px rgba(230, 150, 190, 0.3);
    }

    .tile img { width: 34px; height: 34px; object-fit: contain; }
    .tile svg { width: 34px; height: 34px; }

    .tile span {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    @media (max-width: 900px) {
      .top-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .categories { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Greeting -->
    <div class="greeting">
      <div>
        <div class="greeting-text" id="greeting-text"></div>
        <div class="greeting-sub" id="greeting-sub"></div>
      </div>
      <div class="weather" id="weather"></div>
    </div>

    <!-- Top row: calendar + links -->
    <div class="top-row">
      <div class="widget calendar-widget">
        <div class="widget-header">My Day</div>
        <div class="widget-body">
          <iframe id="cal-frame" scrolling="no"></iframe>
          <script>
            (function() {
              var d = new Date(), y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
              var date = y + '' + m + '' + day;
              // TODO: replace YOUR_EMAIL%40gmail.com with your personal Google account (e.g. me%40gmail.com — %40 is the encoded @)
              var calEmail = 'YOUR_EMAIL%40gmail.com';
              document.getElementById('cal-frame').src = 'https://calendar.google.com/calendar/embed?src=' + calEmail + '&mode=AGENDA&dates=' + date + '/' + date + '&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&height=400';
            })();
          </script>
        </div>
      </div>
      <div class="categories">

        <!--
          ============================================================
          ADD YOUR TILES HERE.

          Each category is a block. Copy a <div class="category">...</div>
          block to add another category, and copy a <a class="tile">...</a>
          to add another link inside it.

          A tile can use either:
            • an image favicon:
                <img src="https://example.com/favicon.ico" alt="Name">
            • or an inline <svg> icon (see the work homepage for examples).

          Easiest favicon source for any site:
                https://www.google.com/s2/favicons?sz=64&domain=example.com
          ============================================================
        -->

        <!-- Google -->
        <div class="category">
          <div class="category-label">Google</div>
          <div class="grid">
            <a class="tile" href="https://mail.google.com" title="Gmail">
              <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico" alt="Gmail">
              <span>Gmail</span>
            </a>
            <a class="tile" href="https://drive.google.com" title="Drive">
              <img src="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_48dp.png" alt="Drive">
              <span>Drive</span>
            </a>
            <a class="tile" href="https://calendar.google.com" title="Calendar">
              <img src="https://calendar.google.com/googlecalendar/images/favicons_2020q4/calendar_31.ico" alt="Calendar">
              <span>Calendar</span>
            </a>
            <a class="tile" href="https://www.google.com/maps/d/" title="My Maps">
              <svg viewBox="0 0 48 48">
                <path d="M24 4C16.3 4 10 10.1 10 17.6 10 28.4 24 44 24 44s14-15.6 14-26.4C38 10.1 31.7 4 24 4z" fill="#34a853"/>
                <path d="M24 4v40s14-15.6 14-26.4C38 10.1 31.7 4 24 4z" fill="#4285f4"/>
                <path d="M16.5 12.5L24 44l7.5-31.5" fill="#fbbc04" opacity="0.5"/>
                <circle cx="24" cy="17" r="5.5" fill="#fff"/>
                <circle cx="24" cy="17" r="2.8" fill="#ea4335"/>
              </svg>
              <span>My Maps</span>
            </a>
          </div>
        </div>

        <!-- Church -->
        <div class="category">
          <div class="category-label">Church</div>
          <div class="grid">
            <a class="tile" href="https://www.churchofjesuschrist.org" title="Church (lds.org)">
              <img src="https://www.google.com/s2/favicons?sz=64&domain=churchofjesuschrist.org" alt="Church">
              <span>lds.org</span>
            </a>
            <!-- TODO: paste your Relief Society spreadsheet URL into href below -->
            <a class="tile" href="https://docs.google.com/spreadsheets/REPLACE_WITH_YOUR_RS_SHEET_ID" title="RS Spreadsheet">
              <img src="https://ssl.gstatic.com/docs/spreadsheets/favicon3.ico" alt="RS Spreadsheet">
              <span>RS Sheet</span>
            </a>
          </div>
        </div>

        <!-- Development -->
        <div class="category">
          <div class="category-label">Development</div>
          <div class="grid">
            <a class="tile" href="https://github.com" title="GitHub">
              <svg viewBox="0 0 48 48">
                <path d="M24 4C12.95 4 4 12.95 4 24c0 8.84 5.73 16.34 13.68 18.98 1 .18 1.37-.43 1.37-.96 0-.47-.02-2.04-.03-3.7-5.56 1.21-6.73-2.35-6.73-2.35-.91-2.31-2.22-2.92-2.22-2.92-1.82-1.24.14-1.22.14-1.22 2.01.14 3.07 2.07 3.07 2.07 1.79 3.06 4.69 2.18 5.83 1.66.18-1.3.7-2.18 1.27-2.68-4.44-.5-9.1-2.22-9.1-9.88 0-2.18.78-3.97 2.06-5.37-.21-.5-.89-2.54.2-5.29 0 0 1.68-.54 5.5 2.05A19.1 19.1 0 0 1 24 13.2c1.7.01 3.42.23 5.02.68 3.81-2.59 5.49-2.05 5.49-2.05 1.09 2.75.41 4.79.2 5.29 1.28 1.4 2.06 3.19 2.06 5.37 0 7.68-4.67 9.37-9.12 9.86.72.62 1.36 1.84 1.36 3.7 0 2.67-.02 4.83-.02 5.49 0 .54.36 1.16 1.38.96C38.28 40.33 44 32.84 44 24c0-11.05-8.95-20-20-20z" fill="#7b5b7e"/>
              </svg>
              <span>GitHub</span>
            </a>
          </div>
        </div>

        <!-- Games -->
        <div class="category">
          <div class="category-label">Games</div>
          <div class="grid">
            <a class="tile" href="https://bigfarm.goodgamestudios.com" title="Big Farm">
              <img src="https://www.google.com/s2/favicons?sz=64&domain=goodgamestudios.com" alt="Big Farm">
              <span>Big Farm</span>
            </a>
            <a class="tile" href="https://stardewvalleywiki.com" title="Stardew Valley Wiki">
              <img src="https://www.google.com/s2/favicons?sz=64&domain=stardewvalleywiki.com" alt="Stardew Wiki">
              <span>Stardew Wiki</span>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // --- Greeting + Clock ---
    function updateGreeting() {
      var h = new Date().getHours();
      var greeting = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      document.getElementById('greeting-text').textContent = greeting;

      var now = new Date();
      var opts = { weekday: 'long', month: 'long', day: 'numeric' };
      var time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('greeting-sub').textContent =
        now.toLocaleDateString(undefined, opts) + '  ·  ' + time;

      // Time-based background
      document.body.classList.remove('evening', 'night');
      if (h >= 20 || h < 5) document.body.classList.add('night');
      else if (h >= 17) document.body.classList.add('evening');
    }
    updateGreeting();
    setInterval(updateGreeting, 30000);

    // --- Weather ---
    (function() {
      var el = document.getElementById('weather');
      function icon(code) {
        if (code === 0) return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="#f4a460"/><g stroke="#f4a460" stroke-width="1.5" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="5" y1="5" x2="7" y2="7"/><line x1="17" y1="17" x2="19" y2="19"/><line x1="5" y1="19" x2="7" y2="17"/><line x1="17" y1="7" x2="19" y2="5"/></g></svg>';
        if (code <= 3) return '<svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="3.5" fill="#f4a460"/><g stroke="#f4a460" stroke-width="1.2" stroke-linecap="round"><line x1="9" y1="3" x2="9" y2="5"/><line x1="3" y1="10" x2="5" y2="10"/><line x1="4" y1="5" x2="5.5" y2="6.5"/><line x1="14" y1="5" x2="12.5" y2="6.5"/></g><path d="M13 12a4.5 4.5 0 1 1-.8 6H7.5a3 3 0 1 1 .3-6h.4" fill="none" stroke="#b0b0b0" stroke-width="1.5"/></svg>';
        if (code <= 48) return '<svg viewBox="0 0 24 24"><path d="M6 17h12M4 14h16M7 11h10" stroke="#b0b0b0" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></svg>';
        if (code <= 67 || (code >= 80 && code <= 82)) return '<svg viewBox="0 0 24 24"><path d="M8 10a4 4 0 1 1 7.5 1H8a3 3 0 1 1 0 0" fill="none" stroke="#7ba4cc" stroke-width="1.5"/><line x1="8" y1="15" x2="7" y2="19" stroke="#7ba4cc" stroke-width="1.3" stroke-linecap="round"/><line x1="12" y1="15" x2="11" y2="19" stroke="#7ba4cc" stroke-width="1.3" stroke-linecap="round"/><line x1="16" y1="15" x2="15" y2="19" stroke="#7ba4cc" stroke-width="1.3" stroke-linecap="round"/></svg>';
        if (code <= 77) return '<svg viewBox="0 0 24 24"><path d="M8 10a4 4 0 1 1 7.5 1H8a3 3 0 1 1 0 0" fill="none" stroke="#7ba4cc" stroke-width="1.5"/><circle cx="8" cy="17" r="1" fill="#b0d4f1"/><circle cx="12" cy="16" r="1" fill="#b0d4f1"/><circle cx="16" cy="18" r="1" fill="#b0d4f1"/></svg>';
        return '<svg viewBox="0 0 24 24"><path d="M8 10a4 4 0 1 1 7.5 1H8a3 3 0 1 1 0 0" fill="none" stroke="#888" stroke-width="1.5"/><path d="M12 14v4M10 16h4" stroke="#f4a460" stroke-width="1.5" stroke-linecap="round"/></svg>';
      }
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
          fetch('https://api.open-meteo.com/v1/forecast?latitude=' + pos.coords.latitude + '&longitude=' + pos.coords.longitude + '&current=temperature_2m,weather_code&temperature_unit=fahrenheit')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              el.innerHTML = icon(data.current.weather_code) + '<span class="weather-temp">' + Math.round(data.current.temperature_2m) + '°F</span>';
            })
            .catch(function() { el.innerHTML = '<span class="weather-desc">Weather unavailable</span>'; });
        }, function() { el.innerHTML = '<span class="weather-desc">Enable location for weather</span>'; });
      }
    })();

  </script>
</body>
</html>
